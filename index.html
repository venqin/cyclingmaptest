 try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){h.insertAdjacentText('afterbegin','此瀏覽器無法顯示 3D 畫面');return}
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));h.prepend(renderer.domElement);
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,1,10,400000);
 controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.06;
 const rs=()=>{const w=h.clientWidth,k=h.clientHeight;renderer.setSize(w,k,false);camera.aspect=w/k;camera.updateProjectionMatrix()};
 new ResizeObserver(rs).observe(h);rs();
 (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);lab()})();
}
function lab(){const h=$('map');[['ls',0],['le',P3.length-1],['lp',-1]].forEach(([id,i])=>{const e=$(id),q=i<0?PK:P3[i];if(!q){e.style.display='none';return}const v=q.clone().project(camera);e.style.display=v.z<1?'block':'none';e.style.transform='translate('+(v.x+1)/2*h.clientWidth+'px,'+(1-v.y)/2*h.clientHeight+'px)'})}
let PK=null;
function build(reset){
 if(!renderer)return;
 const r=R[cur],p=r.p,n=p.length,D=dk(),m=111320;
 if(grp){scene.remove(grp);grp.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()})}
 grp=new THREE.Group();scene.add(grp);
 const la=p.map(a=>a[0]),lo=p.map(a=>a[1]),latc=(Math.min(...la)+Math.max(...la))/2,lonc=(Math.min(...lo)+Math.max(...lo))/2,kx=Math.cos(latc*Math.PI/180);
 const xs=p.map(a=>(a[1]-lonc)*kx*m),zs=p.map(a=>-(a[0]-latc)*m);
 L=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs));
 const ev=p.map(a=>a[2]),e1=Math.max(...ev),S=L*1.45,N=220,W=N+1;
 const g=new THREE.PlaneGeometry(S,S,N,N);g.rotateX(-Math.PI/2);const pa=g.attributes.position;
 const hv=new Float32Array(pa.count);let hm=1;
 for(let i=0;i<pa.count;i++){hv[i]=hD(latc-pa.getZ(i)/m,lonc+pa.getX(i)/(kx*m));if(HW>=.5)hv[i]=0;hm=Math.max(hm,hv[i])}
 const vs=Math.max(1,.2*L/hm);
 for(let i=0;i<pa.count;i++)pa.setY(i,hv[i]*vs);
 const bot=-.1*L,wp=[],ed=[[...Array(W)].map((_,c)=>c),[...Array(W)].map((_,c)=>N*W+c),[...Array(W)].map((_,k)=>k*W),[...Array(W)].map((_,k)=>k*W+N)];
 ed.forEach(e=>{for(let k=1;k<e.length;k++){const a=e[k-1],b=e[k],ax=pa.getX(a),ay=pa.getY(a),az=pa.getZ(a),bx=pa.getX(b),by=pa.getY(b),bz=pa.getZ(b);wp.push(ax,ay,az,bx,by,bz,bx,bot,bz,ax,ay,az,bx,bot,bz,ax,bot,az)}});
 const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.Float32BufferAttribute(wp,3));wg.computeVertexNormals();
 grp.add(new THREE.Mesh(wg,new THREE.MeshPhongMaterial({color:'#4b4237',side:THREE.DoubleSide,flatShading:true,shininess:0})));
 const ng=g.toNonIndexed(),q=ng.attributes.position;let y0=1e9,y1=-1e9;
 for(let i=0;i<q.count;i++){y0=Math.min(y0,q.getY(i));y1=Math.max(y1,q.getY(i))}
 const cl=new Float32Array(q.count*3);
 const wc=new THREE.Color("#2b6a8a");
 for(let i=0;i<q.count;i+=3){const a=q.getY(i),b2=q.getY(i+1),c2=q.getY(i+2),ay=(a+b2+c2)/3,c=(a<1e-6)+(b2<1e-6)+(c2<1e-6)>=2?wc:pc(Math.min(NB-1,Math.floor(ay/(y1||1)*NB)));for(let k=0;k<3;k++){cl[(i+k)*3]=c.r;cl[(i+k)*3+1]=c.g;cl[(i+k)*3+2]=c.b}}
 ng.setAttribute('color',new THREE.BufferAttribute(cl,3));ng.computeVertexNormals();
 grp.add(new THREE.Mesh(ng,new THREE.MeshPhongMaterial({vertexColors:true,shininess:0})));
 const rr=L*.0045;P3=p.map((a,i)=>new THREE.Vector3(xs[i],hD(p[i][0],p[i][1])*vs+rr*1.6,zs[i]));
 const cv=new THREE.CatmullRomCurve3(P3,false,'centripetal'),seg=n*2,tg=new THREE.TubeGeometry(cv,seg,rr,6,false),tc=new Float32Array(tg.attributes.position.count*3),sm=Math.max(...p.map(a=>a[4]))||1;
 for(let i=0;i<=seg;i++){const c=col(p[Math.min(n-1,Math.round(i/seg*(n-1)))][4]/sm);for(let j=0;j<=6;j++){const k=(i*7+j)*3;tc[k]=c.r;tc[k+1]=c.g;tc[k+2]=c.b}}
 tg.setAttribute('color',new THREE.BufferAttribute(tc,3));grp.add(new THREE.Mesh(tg,new THREE.MeshBasicMaterial({vertexColors:true})));
 grp.add(new THREE.Mesh(new THREE.TubeGeometry(cv,seg,rr*1.7,6,false),new THREE.MeshBasicMaterial({color:D?'#0c1822':'#ffffff',side:THREE.BackSide})));
 const sp=(c,v,s)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(L*s,16,12),new THREE.MeshBasicMaterial({color:c}));o.position.copy(v);grp.add(o)};
 sp('#2f9e6f',P3[0],.012);sp(D?'#e3edf1':'#12283a',P3[n-1],.012);
 const pi=ev.indexOf(e1);PK=P3[pi];sp('#f7b32b',PK,.01);$('lp').textContent='路線最高點 '+nf(e1)+' 公尺';
 scene.children.filter(o=>o.isLight).forEach(o=>scene.remove(o));
 const hl=new THREE.HemisphereLight(0xffffff,D?0x35485a:0xa8b4be,D?.55:.85),dl=new THREE.DirectionalLight(0xffffff,D?.55:.85);dl.position.set(.7,1,.5);const fl=new THREE.DirectionalLight(0x8fb4d8,.3);fl.position.set(-.6,.5,-.7);scene.add(hl,dl,fl);
 controls.minDistance=L*.25;controls.maxDistance=L*3.5;
 if(reset){camera.position.set(0,L*.95,L*1.15);controls.target.set(0,L*.04,0);controls.update()}
}
function draw(reset=true){
 const r=R[cur];$('tabs').innerHTML='';
 R.forEach((x,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i==cur);b.textContent=x.date.slice(5,10).replace('-','/')+'　'+x.km+' 公里';b.onclick=()=>{cur=i;draw()};$('tabs').appendChild(b)});
 const [y,m,d]=r.date.slice(0,10).split('-');
 $('ttl').textContent=y+' 年 '+(+m)+' 月 '+(+d)+' 日';
 $('sub').textContent='出發 '+r.date.slice(11)+'　·　'+r.km+' 公里　·　總爬升 '+nf(r.gain)+' 公尺';
 const it=[['距離',r.km,'公里'],['移動時間',ft(r.mv),''],['經過時間',ft(r.tt),''],['平均速度',r.avg,'公里/時'],['最高速度',r.smax,'公里/時'],['總爬升',nf(r.gain),'公尺'],['總下降',nf(r.loss),'公尺'],['最高海拔',nf(r.emax),'公尺'],['平均功率',r.pw,'瓦'],['最大功率',r.pwmax,'瓦'],['平均踏頻',r.cad,'rpm'],['氣溫',r.t[0]+'–'+r.t[1],'°C']];
 $('st').innerHTML=it.map(a=>'<div><dt>'+a[0]+'</dt><dd>'+a[1]+'<small>'+a[2]+'</small></dd></div>').join('');
 build(reset);
}
init();draw();
